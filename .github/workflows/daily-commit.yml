name: Daily Commit

on:
  schedule:
    - cron: "35 18 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update daily log
        run: |
          echo "$(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> daily-log.txt

      - name: Commit and push
        run: |
          git config user.name "Kushagra-234"
          git config user.email "kg7741365@gmail.com"
          git add daily-log.txt
          git commit -m "chore: daily commit" || exit 0
          git push
